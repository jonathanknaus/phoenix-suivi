const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("b"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Ouverture…"; err.textContent = "";
  try {
    const u = document.getElementById("u").value.trim().toLowerCase(), p = document.getElementById("p").value;
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(u + "\n" + p), "PBKDF2", false, ["deriveKey"]);
    // la clé de contenu est emballée une fois par identifiant autorisé : on essaie chaque emballage
    let dek = null;
    for (const k of BLOB.keys) {
      const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(k.salt), iterations: BLOB.iter, hash: BLOB.hash || "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      try { dek = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(k.iv) }, kek, b64(k.ct)); break; } catch (_) {}
    }
    if (!dek) throw new Error("refusé");
    const key = await crypto.subtle.importKey("raw", dek, "AES-GCM", false, ["decrypt"]);
    const clear = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
    const html = new TextDecoder().decode(clear);
    try { sessionStorage.setItem("phx_user", u); } catch (_) {}
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "Identifiant ou mot de passe incorrect.";
    btn.disabled = false; btn.textContent = "Ouvrir";
  }
});
